server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/yiweibao_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: root12345
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

app:
  jwt:
    secret: yiweibao-demo-jwt-secret-key-2026-summer-term-project
    expiration-ms: 86400000
  upload:
    path: ./uploads
  simulation:
    acceleration: 180.0  # ~2h full degradation cycle at normal load
